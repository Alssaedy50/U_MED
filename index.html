    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Capture beforeinstallprompt early so React components never miss the native install prompt
      window.__umedDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__umedDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('umed-pwa-prompt-ready'));
      });
      // Purge legacy cache that could serve stale or mismatched JS bundles
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) {
                if (name !== 'umed-v2.3.0' && name !== 'umed-fonts-v1') {
                  caches.delete(name);
                }
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#f8fafc;font-family:'Cairo',sans-serif;padding:24px;text-align:center;">
        <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0284c7,#0d9488);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(2,132,199,0.35);margin-bottom:16px;font-weight:900;font-size:20px;color:#fff;">
          U
        </div>
        <div style="font-size:16px;font-weight:700;color:#e2e8f0;margin-bottom:6px;">
          منصة الطب البشري الموحدة — UMED
        </div>
        <div style="font-size:12px;color:#94a3b8;">
          جاري تهيئة النظام الأكاديمي والسريري...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) {
              try { reg.update(); } catch (e) {}
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
