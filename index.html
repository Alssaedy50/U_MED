<!doctype html>
<html lang="ar" dir="rtl" data-theme="medical">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="المنصة الأكاديمية والسريرية الموحدة لطلاب كليات الطب البشري في الجامعات اليمنية - UMED Unified Medical Education Platform" />
    <meta property="og:title" content="UMED | منصة الطب البشري الموحدة - اليمن" />
    <meta property="og:description" content="المنصة الأكاديمية والسريرية الموحدة لطلاب كليات الطب البشري في الجامعات اليمنية - UMED Unified Medical Education Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UMED" />
    <link rel="manifest" href="/api/pwa-manifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/api/pwa-icon?size=192" />
    <title>UMED | منصة الطب البشري الموحدة - اليمن</title>
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('umed-theme') || 'medical';
          document.documentElement.setAttribute('data-theme', savedTheme);
          if (savedTheme === 'dark' || savedTheme === 'gold') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'medical');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      html[data-theme="medical"], html:not([data-theme]) {
        background-color: #eef6f9;
        color: #082f49;
      }
      html[data-theme="light"] {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      html[data-theme="dark"] {
        background-color: #060b14;
        color: #f8fafc;
      }
      html[data-theme="gold"] {
        background-color: #0c0a06;
        color: #fef3c7;
      }
      #umed-boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #eef6f9;
        color: #082f49;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      html[data-theme="light"] #umed-boot-splash {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      html[data-theme="dark"] #umed-boot-splash {
        background-color: #060b14;
        color: #f8fafc;
      }
      html[data-theme="gold"] #umed-boot-splash {
        background-color: #0c0a06;
        color: #fef3c7;
      }
      #umed-boot-splash .splash-subtitle {
        font-size: 12px;
        color: #475569;
      }
      html.dark #umed-boot-splash .splash-subtitle {
        color: #94a3b8;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
      />
    </noscript>
    <script>
      // Capture beforeinstallprompt early so React components never miss the native install prompt
      window.__umedDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__umedDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('umed-pwa-prompt-ready'));
      });
      // Purge legacy cache that could serve stale or mismatched JS bundles
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) {
                if (name !== 'umed-v2.5.0' && name !== 'umed-fonts-v1') {
                  caches.delete(name);
                }
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
      <div id="umed-boot-splash">
        <div id="umed-boot-splash-logo" style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0284c7,#0d9488);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(2,132,199,0.28);margin-bottom:16px;font-weight:900;font-size:20px;color:#ffffff;overflow:hidden;">
          U
        </div>
        <div id="umed-boot-splash-title" style="font-size:16px;font-weight:700;margin-bottom:6px;">
          منصة الطب البشري الموحدة — UMED
        </div>
        <div class="splash-subtitle">
          جاري تهيئة النظام الأكاديمي والسريري...
        </div>
        <script>
          (function () {
            try {
              var raw = localStorage.getItem('umed_platform_settings_v1');
              if (!raw) return;
              var parsed = JSON.parse(raw);
              if (!parsed || typeof parsed !== 'object') return;
              var logoBox = document.getElementById('umed-boot-splash-logo');
              var titleBox = document.getElementById('umed-boot-splash-title');
              if (titleBox && parsed.platformNameArabic) {
                titleBox.textContent = parsed.platformNameArabic;
                document.title = parsed.platformNameArabic;
              }
              if (logoBox && parsed.logoDataUrl) {
                logoBox.style.width = 'auto';
                logoBox.style.minWidth = '64px';
                logoBox.style.maxWidth = '180px';
                logoBox.style.height = '64px';
                logoBox.style.padding = '6px 10px';
                logoBox.style.background = '#ffffff';
                logoBox.style.border = '1px solid rgba(148, 163, 184, 0.35)';
                logoBox.innerHTML = '';
                var img = document.createElement('img');
                img.src = parsed.logoDataUrl;
                img.alt = parsed.platformShortName || 'UMED';
                img.style.maxWidth = '100%';
                img.style.maxHeight = '100%';
                img.style.width = 'auto';
                img.style.height = 'auto';
                img.style.objectFit = 'contain';
                logoBox.appendChild(img);
                var iconLink = document.querySelector("link[rel~='icon']");
                if (iconLink) iconLink.href = parsed.logoDataUrl;
                var appleIconLink = document.querySelector("link[rel='apple-touch-icon']");
                if (appleIconLink) appleIconLink.href = parsed.logoDataUrl;
              } else if (logoBox && parsed.platformShortName) {
                logoBox.textContent = String(parsed.platformShortName).trim().charAt(0).toUpperCase() || 'U';
              }
            } catch (e) {}
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) {
              try { reg.update(); } catch (e) {}
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
